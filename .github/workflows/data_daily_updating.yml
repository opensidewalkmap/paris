name: data_daily_updating

on:
  # Configuration and workflow changes trigger a complete rebuild.
  push:
    branches: [main]
    paths:
      - ".github/workflows/data_daily_updating.yml"
      - "config.py"
  schedule:
    - cron: "30 7 * * *"
  workflow_dispatch:
    inputs:
      force_regeneration:
        description: Rebuild the complete derived output set
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  actions: write

concurrency:
  group: oswm-node-writer-${{ github.repository }}
  cancel-in-progress: true

jobs:
  validate_node_identity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reject inherited data from another city
        run: |
          python - <<'PY'
          import json
          import runpy
          from pathlib import Path
          config = runpy.run_path('config.py')
          path = Path('data/boundaries/infos.json')
          if path.exists():
              recorded = json.loads(path.read_text()).get('name')
              assert recorded == config['CITY_NAME'], f"Refusing to publish {recorded} data as {config['CITY_NAME']}; reset inherited template data first"
          PY
  data_daily_updating:
    needs: validate_node_identity
    permissions:
      contents: write
      actions: write
    uses: kauevestena/oswm_codebase/.github/workflows/node_build.yml@main
    with:
      mode: daily
      core_ref: main
      force_regeneration: ${{ github.event_name == 'push' || inputs.force_regeneration || false }}
