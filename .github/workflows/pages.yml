name: deploy_pages

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/pages.yml"
      - "index.html"
      - "map.html"
      - "webmap_params.json"
      - "oswm-build.json"
      - "oswm_runtime/**"
      - "data/**"
      - "metadata/**"
      - "hub/**"
      - "quality_check/**"
      - "statistics/**"
      - "statistics_specs/**"
      - "assets/**"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: oswm-pages-${{ github.repository }}
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      - name: Verify generated products belong to this node
        run: |
          python - <<'PY'
          import json
          import runpy
          from pathlib import Path
          config = runpy.run_path('config.py')
          manifest = json.loads(Path('oswm-build.json').read_text())
          boundary = json.loads(Path('data/boundaries/infos.json').read_text())
          assert manifest['node'] == config['CITY_NAME'], 'Build manifest belongs to another city'
          assert boundary['name'] == config['CITY_NAME'], 'Boundary belongs to another city'
          PY
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
